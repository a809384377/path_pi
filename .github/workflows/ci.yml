name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [22.19.0, 24.x, 25.x]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Validate MCP Registry metadata
        run: |
          curl -fsSL https://raw.githubusercontent.com/modelcontextprotocol/registry/main/docs/reference/server-json/draft/server.schema.json -o "$RUNNER_TEMP/mcp-server-schema.json"
          npx --yes ajv-cli@5 validate -s "$RUNNER_TEMP/mcp-server-schema.json" -d server.json --strict=false
      - name: Install and smoke packaged artifact
        shell: bash
        run: |
          npm pack --json > "$RUNNER_TEMP/pack.json"
          TARBALL=$(node -p "JSON.parse(require('fs').readFileSync(process.argv[1], 'utf8'))[0].filename" "$RUNNER_TEMP/pack.json")
          PREFIX="$RUNNER_TEMP/package-prefix"
          npm install -g --prefix "$PREFIX" "./$TARBALL"
          set +e
          "$PREFIX/bin/pi-agent-mcp" --version > "$RUNNER_TEMP/arg.out" 2> "$RUNNER_TEMP/arg.err"
          STATUS=$?
          set -e
          test "$STATUS" -eq 2
          grep -q "does not accept command-line arguments" "$RUNNER_TEMP/arg.err"
          node test/fixtures/package-smoke.mjs "$PREFIX/bin/pi-agent-mcp" "$GITHUB_WORKSPACE/test/fixtures/fake-pi.mjs"
